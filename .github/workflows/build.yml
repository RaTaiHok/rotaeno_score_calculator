name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================
  #  Windows (NSIS Installer + Portable exe)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        run: cargo tauri build

      - name: Debug — list outputs
        run: |
          echo "=== target/release ==="
          ls target/release/*.exe 2>/dev/null || echo "(no exe)"
          echo "=== bundle/nsis ==="
          find target/release/bundle -type f 2>/dev/null || echo "(no bundle)"
        shell: bash

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-NSIS
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: target/release/rotaeno_score_calc.exe
          if-no-files-found: warn

  # ============================================================
  #  Android (APK)
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Tauri Android init
        run: cargo tauri android init

      - name: Fix generated files
        run: |
          # Fix Logger.kt — BuildConfig.DEBUG is broken with custom package names
          LOGGER_FILE=$(find src-tauri/gen/android -name "Logger.kt" -type f | head -1)
          if [ -f "$LOGGER_FILE" ]; then
            sed -i 's/return BuildConfig.DEBUG/return false \/\/ BuildConfig.DEBUG/' "$LOGGER_FILE"
            echo "Logger.kt fixed: $LOGGER_FILE"
          fi
          # Ensure correct package name in build.gradle.kts
          sed -i 's/"com\.example\.[^"]*"/"com.rthsama.rotaeno.calc"/g' src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || true
          echo "build.gradle.kts package name ensured"
        shell: bash

      - name: Build Android APK
        run: cargo tauri android build

      - name: Debug — list APKs
        run: find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "(no APKs)"
        shell: bash

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: warn

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-universal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: warn

  # ============================================================
  #  iOS IPA (无签名 — 用户自行用 AltStore/SideStore/TrollStore 签名安装)
  # ============================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Toolchain ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # ---- Generate Xcode project ----
      - name: Generate iOS Xcode project
        run: cargo tauri ios init

      # ---- Build unsigned IPA via the official Tauri flow ----
      # `cargo tauri ios build` runs beforeBuildCommand (frontend build), writes the
      # <identifier>-server-addr RPC file that the Xcode "Build Rust Code" script
      # phase reads via WebSocket, builds the Rust library, runs xcodebuild + archive,
      # and creates the IPA. --no-sign skips code signing; --ci skips prompts.
      # Running xcodebuild directly is NOT possible because the script phase
      # requires that RPC server to be alive (see tauri-cli mobile/mod.rs).
      - name: Build unsigned IPA
        run: cargo tauri ios build --no-sign --ci

      # ---- Ad-hoc sign + package ----
      # The --no-sign IPA is completely unsigned. Ad-hoc signing the Mach-O
      # binaries with ldid makes the IPA accepted more reliably by
      # AltStore / SideStore / TrollStore. Output filename is ASCII-safe.
      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail

          IPA_SRC=$(find "$GITHUB_WORKSPACE/src-tauri/gen/apple/build" -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA_SRC" ]; then
            echo "ERROR: no IPA found under src-tauri/gen/apple/build"
            find "$GITHUB_WORKSPACE/src-tauri/gen/apple/build" -type f 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Found IPA: $IPA_SRC"

          SKIP_LDID=0
          if ! command -v ldid >/dev/null 2>&1; then
            echo "Installing ldid..."
            brew install ldid || { echo "WARNING: ldid install failed, skipping ad-hoc signing"; SKIP_LDID=1; }
          fi

          WORK="$RUNNER_TEMP/ipa-work"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          unzip -q "$IPA_SRC"

          APP_DIR=$(find Payload -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: no .app inside the IPA"
            find Payload -maxdepth 2 2>/dev/null | head -20
            exit 1
          fi
          echo "Found app: $APP_DIR"

          if [ "$SKIP_LDID" = "0" ]; then
            echo "Ad-hoc signing Mach-O binaries..."
            find "$APP_DIR" -type f | while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                ldid -S "$f" 2>/dev/null || echo "  (skipped $f)"
              fi
            done
          fi

          # Re-package with an ASCII-safe IPA filename
          zip -qry "$RUNNER_TEMP/RotaenoScoreCalc.ipa" Payload

          mkdir -p "$GITHUB_WORKSPACE/ipa-output"
          cp "$RUNNER_TEMP/RotaenoScoreCalc.ipa" "$GITHUB_WORKSPACE/ipa-output/RotaenoScoreCalc.ipa"
          echo "=== IPA ==="
          ls -la "$GITHUB_WORKSPACE/ipa-output/"

      # ---- Upload artifact ----
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-unsigned
          path: ipa-output/RotaenoScoreCalc.ipa
          if-no-files-found: error
