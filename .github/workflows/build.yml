name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 避免卡在 updating crates.io index
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # ============================================================
  #  Windows — 多架构 Portable exe（x64 / x86 / arm64）
  # ============================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64x
            target: x86_64-pc-windows-msvc
            arch: x64
          - name: Windows32x
            target: i686-pc-windows-msvc
            arch: x86
          - name: Windowsarm64
            target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 配置 MSVC 环境：vswhere 定位 VS + vcvarsall 导出 PATH/LIB/INCLUDE
      # （确保用 MSVC 的 link.exe，而非 Git Bash 的）
      - name: Setup MSVC environment
        shell: bash
        run: |
          set -euo pipefail
          ARCH=${{ matrix.arch }}
          VS_PATH=""
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          if [ -f "$VSWHERE" ]; then
            VS_PATH=$("$VSWHERE" -products '*' -latest -property installationPath 2>/dev/null || true)
          fi
          if [ -z "$VS_PATH" ]; then
            for p in "/c/Program Files/Microsoft Visual Studio/2026" "/c/Program Files/Microsoft Visual Studio/2025" "/c/Program Files/Microsoft Visual Studio/2022" "/c/Program Files/Microsoft Visual Studio/18" "/c/Program Files (x86)/Microsoft Visual Studio/2022"; do
              if [ -d "$p" ]; then
                VS_PATH="$p"
                break
              fi
            done
          fi
          if [ -z "$VS_PATH" ]; then
            echo "ERROR: Visual Studio not found"
            exit 1
          fi
          echo "VS installation: $VS_PATH"
          VCVARS="$VS_PATH/VC/Auxiliary/Build/vcvarsall.bat"
          # 用 printf 生成批处理，避免 cmd //c 的引号转义问题
          printf '@echo off\r\ncall "%s" %s >nul 2>&1\r\nif errorlevel 1 exit /b 1\r\necho PATH=%%PATH%%\r\necho LIB=%%LIB%%\r\necho INCLUDE=%%INCLUDE%%\r\n' "$VCVARS" "$ARCH" > "$RUNNER_TEMP/setenv.cmd"
          ENV_FILE="$RUNNER_TEMP/vcvars.env"
          cmd //c "$(cygpath -w "$RUNNER_TEMP")/setenv.cmd" > "$ENV_FILE" 2>/dev/null
          if [ ! -s "$ENV_FILE" ]; then
            echo "ERROR: vcvarsall failed for arch=$ARCH"
            exit 1
          fi
          while IFS='=' read -r key value; do
            case "$key" in
              PATH|LIB|INCLUDE)
                echo "$key=$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < "$ENV_FILE"
          echo "MSVC environment configured (arch=$ARCH)"

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # --no-bundle: 只产出便携版 exe，不构建 NSIS 安装包
      - name: Build portable exe
        shell: bash
        run: cargo tauri build --no-bundle --target ${{ matrix.target }}

      - name: Package zip
        shell: powershell
        run: |
          Copy-Item "target/${{ matrix.target }}/release/rotaeno_score_calc.exe" "$env:RUNNER_TEMP/Rotaeno_Score_Calc-${{ matrix.name }}.exe"
          Compress-Archive -Path "$env:RUNNER_TEMP/Rotaeno_Score_Calc-${{ matrix.name }}.exe" -DestinationPath "$env:RUNNER_TEMP/Rotaeno_Score_Calc-${{ matrix.name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-${{ matrix.name }}
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-${{ matrix.name }}.zip
          if-no-files-found: error

  # ============================================================
  #  Android — 签名 APK（secrets 优先，否则临时 keystore）
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Tauri Android init
        run: cargo tauri android init

      # 编译 Rust .so + 前端 + 由 tauri 内部 gradle 打包（此阶段无签名，无妨）
      - name: Build Android (tauri)
        run: cargo tauri android build

      # ---- build 之后修复生成文件（对齐本地 build_android.sh，避免被 tauri 重新生成覆盖）----
      - name: Fix generated files
        run: |
          # Fix Logger.kt — BuildConfig.DEBUG is broken with custom package names
          LOGGER_FILE=$(find src-tauri/gen/android -name "Logger.kt" -type f | head -1)
          if [ -f "$LOGGER_FILE" ]; then
            sed -i 's/return BuildConfig.DEBUG/return false \/\/ BuildConfig.DEBUG/' "$LOGGER_FILE"
            echo "Logger.kt fixed: $LOGGER_FILE"
          fi
          # Ensure correct package name in build.gradle.kts
          sed -i 's/"com\.example\.[^"]*"/"com.rthsama.rotaeno.calc"/g' src-tauri/gen/android/app/build.gradle.kts 2>/dev/null || true
          echo "build.gradle.kts package name ensured"
        shell: bash

      # tauri 模板不含 signingConfigs（tauri-cli 2.10+），注入签名配置
      - name: Inject Android signingConfigs
        run: python3 .github/android-patch/apply_android_signing.py src-tauri/gen/android/app/build.gradle.kts

      # tauri android build 可能把自定义图标重置为默认，重新从 app-icon.png 生成
      - name: Generate Android icons
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          ICON_SRC="src-tauri/icons/app-icon.png"
          RES_DIR="src-tauri/gen/android/app/src/main/res"
          if [ -f "$ICON_SRC" ]; then
            rm -f "$RES_DIR/drawable/ic_launcher_background.xml"
            rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml"
            for size in 48 72 96 144 192; do
              case $size in
                48)  dir="mipmap-mdpi" ;;
                72)  dir="mipmap-hdpi" ;;
                96)  dir="mipmap-xhdpi" ;;
                144) dir="mipmap-xxhdpi" ;;
                192) dir="mipmap-xxxhdpi" ;;
              esac
              ffmpeg -y -i "$ICON_SRC" -vf "scale=${size}:${size}" "$RES_DIR/$dir/ic_launcher.png" 2>/dev/null
              cp "$RES_DIR/$dir/ic_launcher.png" "$RES_DIR/$dir/ic_launcher_round.png"
              cp "$RES_DIR/$dir/ic_launcher.png" "$RES_DIR/$dir/ic_launcher_foreground.png"
            done
            echo "Android 图标已生成"
          fi
        shell: bash

      # 签名配置放在 build 之后、gradlew 打包之前，确保不被 tauri 重新生成覆盖
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="src-tauri/gen/android/app"
          mkdir -p "$APP_DIR"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "使用 GitHub Secrets 中的正式 keystore"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > src-tauri/nekoRTHsama.jks
            {
              echo "storeFile=../../../nekoRTHsama.jks"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "v1SigningEnabled=true"
              echo "v2SigningEnabled=true"
              echo "v3SigningEnabled=true"
            } > "$APP_DIR/keystore.properties"
          else
            echo "未配置 secrets.ANDROID_KEYSTORE_B64，生成临时 keystore（仅保证可安装）"
            keytool -genkey -v -keystore "$APP_DIR/release.jks" -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias release -dname "CN=CI Build, O=Rotaeno, C=CN" -storepass rotaeno123 -keypass rotaeno123 2>/dev/null
            {
              echo "storeFile=release.jks"
              echo "storePassword=rotaeno123"
              echo "keyAlias=release"
              echo "keyPassword=rotaeno123"
              echo "v1SigningEnabled=true"
              echo "v2SigningEnabled=true"
              echo "v3SigningEnabled=true"
            } > "$APP_DIR/keystore.properties"
          fi
          echo "keystore.properties written"

      # 跳过 Rust 编译，直接用 jniLibs 里的 .so + keystore 签名打包所有 ABI
      - name: Gradle assembleRelease (signed)
        working-directory: src-tauri/gen/android
        run: |
          ./gradlew assembleRelease \
            -x :app:rustBuildArm64Release \
            -x :app:rustBuildArmRelease \
            -x :app:rustBuildX86Release \
            -x :app:rustBuildX86_64Release

      - name: Debug — list APKs
        run: find src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "(no APKs)"
        shell: bash

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          OUT="src-tauri/gen/android/app/build/outputs/apk"
          STAGE="$RUNNER_TEMP/android"
          mkdir -p "$STAGE"
          if [ -f "$OUT/universal/release/app-universal-release.apk" ]; then
            cp "$OUT/universal/release/app-universal-release.apk" "$STAGE/Rotaeno_Score_Calc-Android.apk"
          elif [ -f "$OUT/universal/release/app-universal-release-unsigned.apk" ]; then
            echo "WARNING: only unsigned APK available"
            cp "$OUT/universal/release/app-universal-release-unsigned.apk" "$STAGE/Rotaeno_Score_Calc-Android-unsigned.apk"
          fi
          if [ -f "$OUT/arm64/release/app-arm64-release.apk" ]; then
            cp "$OUT/arm64/release/app-arm64-release.apk" "$STAGE/Rotaeno_Score_Calc-Android-arm64.apk"
          fi
          ls -la "$STAGE"
          cd "$STAGE"
          zip -r "$RUNNER_TEMP/Rotaeno_Score_Calc-Android.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-Android
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-Android.zip
          if-no-files-found: error

  # ============================================================
  #  iOS IPA（无签名 — 用户自行用 AltStore/SideStore/TrollStore 签名安装）
  # ============================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Generate iOS Xcode project
        run: cargo tauri ios init

      - name: Build unsigned IPA
        run: cargo tauri ios build --no-sign --ci

      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail

          IPA_SRC=$(find "$GITHUB_WORKSPACE/src-tauri/gen/apple/build" -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA_SRC" ]; then
            echo "ERROR: no IPA found under src-tauri/gen/apple/build"
            find "$GITHUB_WORKSPACE/src-tauri/gen/apple/build" -type f 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Found IPA: $IPA_SRC"

          SKIP_LDID=0
          if ! command -v ldid >/dev/null 2>&1; then
            echo "Installing ldid..."
            brew install ldid || { echo "WARNING: ldid install failed, skipping ad-hoc signing"; SKIP_LDID=1; }
          fi

          WORK="$RUNNER_TEMP/ipa-work"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          unzip -q "$IPA_SRC"

          APP_DIR=$(find Payload -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: no .app inside the IPA"
            find Payload -maxdepth 2 2>/dev/null | head -20
            exit 1
          fi
          echo "Found app: $APP_DIR"

          if [ "$SKIP_LDID" = "0" ]; then
            echo "Ad-hoc signing Mach-O binaries..."
            find "$APP_DIR" -type f | while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                ldid -S "$f" 2>/dev/null || echo "  (skipped $f)"
              fi
            done
          fi

          # Re-package with ASCII-safe name
          zip -qry "$RUNNER_TEMP/Rotaeno_Score_Calc-iOS.ipa" Payload

      - name: Package zip
        run: |
          cd "$RUNNER_TEMP"
          zip -r "Rotaeno_Score_Calc-iOS.zip" Rotaeno_Score_Calc-iOS.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-iOS
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-iOS.zip
          if-no-files-found: error

  # ============================================================
  #  macOS — .app（ad-hoc 签名）
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # --bundles app: 只生成 .app（不生成 dmg）
      - name: Build macOS app
        run: cargo tauri build --bundles app

      # Apple Silicon 要求 arm64 可执行文件有签名；无开发者证书时 ad-hoc 签名保证可运行
      - name: Ad-hoc codesign
        run: |
          APP=$(find target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "Found app: $APP"
          codesign --force --deep --sign - "$APP" || echo "WARNING: ad-hoc codesign failed"

      - name: Package zip
        run: |
          APP=$(find target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          # 统一 .app 名称后打包，方便汇总
          STAGE="$RUNNER_TEMP/macos"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Rotaeno_Score_Calc-Mac.app"
          cd "$STAGE"
          zip -qry "$RUNNER_TEMP/Rotaeno_Score_Calc-Mac.zip" Rotaeno_Score_Calc-Mac.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-Mac
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-Mac.zip
          if-no-files-found: error

  # ============================================================
  #  Linux — .deb 包
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Linux package
        run: cargo tauri build --bundles deb

      - name: Package zip
        run: |
          STAGE="$RUNNER_TEMP/linux"
          mkdir -p "$STAGE"
          cp target/release/bundle/deb/*.deb "$STAGE/Rotaeno_Score_Calc-Linux.deb"
          cd "$STAGE"
          zip -r "$RUNNER_TEMP/Rotaeno_Score_Calc-Linux.zip" Rotaeno_Score_Calc-Linux.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-Linux
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-Linux.zip
          if-no-files-found: error

  # ============================================================
  #  汇总：所有平台产物打成一个 zip（不套 zip，直接放构建文件）
  # ============================================================
  collect-artifacts:
    needs: [build-windows, build-android, build-ios, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Unzip and combine into one folder
        run: |
          set -euo pipefail
          mkdir -p combined
          for z in artifacts/*.zip; do
            echo "Unzipping: $z"
            unzip -o -q "$z" -d combined/
          done
          echo "=== Combined files ==="
          ls -la combined/

      - name: Package all-in-one zip
        run: |
          cd combined
          zip -qry "$RUNNER_TEMP/Rotaeno_Score_Calc-All.zip" .

      - name: Upload all-in-one zip
        uses: actions/upload-artifact@v4
        with:
          name: Rotaeno_Score_Calc-All
          path: ${{ runner.temp }}/Rotaeno_Score_Calc-All.zip
          if-no-files-found: error
