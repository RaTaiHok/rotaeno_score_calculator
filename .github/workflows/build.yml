name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios-sign:
        description: 'Build signed iOS IPA (requires secrets)'
        type: boolean
        default: false

jobs:
  # ============================================================
  #  Windows (MSI + NSIS + Portable)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload Portable Binary
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: src-tauri/target/release/rotaeno_score_calc.exe
          if-no-files-found: warn

  # ============================================================
  #  Android (APK)
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Tauri Android init
        run: cargo tauri android init

      - name: Build Android APK
        run: cargo tauri android build

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: warn

      - name: Upload APK (arm)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-arm
          path: src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release.apk
          if-no-files-found: warn

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-x86_64
          path: src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk
          if-no-files-found: warn

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-universal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: warn

  # ============================================================
  #  iOS IPA (无签名 — 用户自行用 AltStore/SideStore/TrollStore 签名安装)
  # ============================================================
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Toolchain ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # ---- Build frontend ----
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Build Rust library for iOS ----
      - name: Build Rust library
        run: cargo build --release --target aarch64-apple-ios
        working-directory: src-tauri

      # ---- Generate Xcode project ----
      - name: Tauri iOS init
        run: cargo tauri ios init

      # ---- Build .app with xcodebuild (skip signing) ----
      - name: Build iOS .app (unsigned)
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple

          # Find the scheme name (usually the app name)
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          # prefer workspace schemes, fall back to project schemes
          ws = data.get('workspace',{}).get('schemes',[])
          pj = data.get('project',{}).get('schemes',[])
          schemes = ws or pj
          print(schemes[0] if schemes else 'rotaeno_score_calc')
          " 2>/dev/null || echo "rotaeno_score_calc")
          echo "Scheme: $SCHEME"

          # Detect workspace or project
          if ls *.xcworkspace >/dev/null 2>&1; then
            WORKSPACE=$(ls *.xcworkspace | head -1)
            echo "Using workspace: $WORKSPACE"
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ./build/ios \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              -destination 'generic/platform=iOS'
          else
            XCODEPROJ=$(ls *.xcodeproj | head -1)
            echo "Using project: $XCODEPROJ"
            xcodebuild \
              -project "$XCODEPROJ" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ./build/ios \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              -destination 'generic/platform=iOS'
          fi

      # ---- Locate .app and ad-hoc sign with ldid then package IPA ----
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple

          # Find the built .app
          APP_PATH=$(find build/ios -name "*.app" -type d -maxdepth 5 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find .app bundle"
            find build/ios -type d | head -30
            exit 1
          fi
          echo "Found app: $APP_PATH"

          APP_NAME=$(basename "$APP_PATH" .app)
          echo "App name: $APP_NAME"

          # Ad-hoc sign all Mach-O binaries with ldid (makes IPA valid for sideload tools)
          echo "Ad-hoc signing binaries..."
          find "$APP_PATH" -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              ldid -S "$file" 2>/dev/null || echo "  (skipped ad-hoc sign for $file)"
            fi
          done

          # Package into IPA (IPA = zip with Payload/)
          IPA_DIR="$RUNNER_TEMP/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -r "$APP_PATH" "$IPA_DIR/Payload/"

          IPA_FILE="$RUNNER_TEMP/${APP_NAME}.ipa"
          cd "$IPA_DIR"
          zip -r "$IPA_FILE" Payload
          cd -

          # Copy to expected path
          mkdir -p build/ios/ipa
          cp "$IPA_FILE" build/ios/ipa/

          echo "✅ IPA created: build/ios/ipa/${APP_NAME}.ipa"

      # ---- Upload artifact ----
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-unsigned
          path: src-tauri/gen/apple/build/ios/ipa/*.ipa
          if-no-files-found: error
